<title>주문 상태</title>
<script>if (window.self !== window.top) {
  document.documentElement.classList.add('embedded');
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !('theme' in e.data)) return;
    const root = document.documentElement;
    if (e.data.theme === 'light' || e.data.theme === 'dark') {
      root.setAttribute('data-theme', e.data.theme);
      root.style.colorScheme = e.data.theme;
    } else {
      root.removeAttribute('data-theme');
      root.style.colorScheme = '';
    }
  });
  parent.postMessage({ themeRequest: true }, '*');
  addEventListener('load', () => new ResizeObserver(() => parent.postMessage({ figureHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*')).observe(document.body));
}</script>

    --color-page: var(--color-neutral-950);
    --color-gallery: var(--color-neutral-950);
    --color-group: var(--color-neutral-850);
    --color-group-border: var(--color-neutral-600);
    --color-heat-low: var(--color-blue-850);
    --color-heat-high: var(--color-blue-600);
    --color-heat-ink: var(--color-gray-0);
    --color-heat-ink-on: var(--color-gray-0);
    --color-series-2: #f08a5d;

    --color-plate-border: var(--color-neutral-800);

[data-theme='dark'] {

  --color-bg: var(--color-neutral-900);
  --color-node: var(--color-neutral-850);
  --color-surface: var(--color-neutral-800);
  --color-border: var(--color-neutral-600);
  --color-card-on: var(--color-blue-900);
  --color-frame: var(--color-neutral-800);
  --color-page: var(--color-neutral-950);
  --color-gallery: var(--color-neutral-950);
  --color-group: var(--color-neutral-850);
  --color-group-border: var(--color-neutral-600);
  --color-heat-low: var(--color-blue-850);
  --color-heat-high: var(--color-blue-600);
  --color-heat-ink: var(--color-gray-0);
  --color-heat-ink-on: var(--color-gray-0);
  --color-series-2: #f08a5d;
  --color-grid: var(--color-neutral-750);
  --color-plate-border: var(--color-neutral-800);
}
/* 재생기 틀과 조작 막대. iframe 안(html.embedded)에서는 테두리와 바깥 여백을 뺀다. */
/* 그림 표시 폭 규칙: 문서 미리보기, 목록 카드, 재생기가 같다. 컨테이너 폭은 화면 폭에서 좌우 바깥 여백(space-16)을 뺀 값이고,
   그림 폭은 min(표준 캔버스 폭, 컨테이너 폭)이다. 컨테이너 안쪽에는 좌우 여백과 레이아웃을 차지하는 테두리를 두지 않아 세 곳의 그림 폭이 같다. */
body {
  margin: 0;
  padding: var(--space-12) var(--space-16);
  font-family: var(--font-sans);
  color: var(--color-fg);
  background: var(--color-page);
}

/* 목록 쪽 카드 안은 틀이 카드 너비를 다 채워 양옆이 비치지 않게 하고, 바탕은 재생기 쪽과 같은 색으로 둔다. */
html.embedded body {
  padding: 0;
  background: var(--color-bg);
}

.fl-figure {
  position: relative;
  max-width: var(--size-figure-canvas);
  margin: 0 auto;
  overflow: hidden;
  color: var(--color-fg);
  background: var(--color-bg);
  border-radius: var(--radius-2xl);
  box-shadow: 0 0 0 var(--border-thin) var(--color-frame);
}

html.embedded .fl-figure {
  max-width: none;
  border-radius: 0;
  box-shadow: none;
}

/* 카드 전체가 그림 판 한 덩어리다. 제목 줄, 그림 영역, 조작 줄이 모두 color.bg 한 톤이라 숫자 둘레 halo와 선 라벨 알약도 그대로 맞는다. */
.fl-canvas {
  padding: var(--space-6) 0;
  background: var(--color-bg);
  overflow: auto;
}

.fl-canvas svg {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100vh - var(--size-player-chrome));
  margin: 0 auto;
}

/* iframe 높이는 목록 쪽이 문서 높이에 맞춘다. 화면 높이로 줄이면 서로 맞추다 계속 작아진다. */
html.embedded .fl-canvas svg {
  max-height: none;
}

/* 조작 막대와 설명 줄은 한 가운데 축을 쓴다. 위아래 안쪽 여백이 같고, 막대와 설명 사이는 한 칸(space-6)이다. */
.fl-foot {
  display: grid;
  gap: var(--space-6);
  justify-items: center;
  padding: var(--space-8);
  background: var(--color-bg);
  border-top: var(--border-thin) solid var(--color-frame);
}

/* 양쪽 칸 너비가 같아(1fr) 배속 글자가 바뀌어도 탭 묶음이 설명과 같은 축에 있다. */
.fl-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: var(--space-5);
  align-items: center;
}

.fl-bar .fl-pause {
  justify-self: end;
}

.fl-bar .fl-rate {
  justify-self: start;
}

/* 현재 탭의 진행은 일시정지 단추 테두리 위를 12시에서 시계 방향으로 도는 accent 고리다. 트랙은 단추 테두리 그대로다. */
.fl-pause {
  position: relative;
}

.fl-ring {
  position: absolute;
  inset: calc(-1 * var(--border-thin));
  width: calc(100% + 2 * var(--border-thin));
  height: calc(100% + 2 * var(--border-thin));
  pointer-events: none;
}

.fl-ring-fill {
  fill: none;
  stroke: var(--color-accent);
}

.fl-pause-icon {
  display: grid;
  place-items: center;
}

.fl-round {
  display: grid;
  place-items: center;
  min-width: var(--size-control);
  height: var(--size-control);
  padding: 0 var(--space-2);
  font: var(--size-text-13) var(--font-sans);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--color-muted);
  background: var(--color-node);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-full);
  cursor: pointer;
}

.fl-round:hover,
.fl-tabs button:hover {
  color: var(--color-fg);
}

.fl-round:focus-visible,
.fl-tabs button:focus-visible {
  outline: var(--border-tag) solid var(--color-accent);
  outline-offset: var(--space-1);
}

/* 분할 조작(재생기 탭, 목록 쪽 테마 묶음)과 둥근 단추는 한 모양이다. 바깥 높이 control, 안쪽 단추 높이 control-inner, 반지름 full. */
.fl-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  box-sizing: border-box;
  justify-content: center;
  min-height: var(--size-control);
  padding: var(--space-1-5);
  background: var(--color-bg);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-full);
}

.fl-tabs button {
  position: relative;
  display: grid;
  place-items: center;
  min-height: var(--size-control-inner);
  padding: 0 var(--space-7);
  font: var(--size-text-13) var(--font-sans);
  color: var(--color-muted);
  background: transparent;
  border: 0;
  border-radius: var(--radius-full);
  cursor: pointer;
}

/* segmented 방식: 켜진 탭은 꽉 찬 알약이다. 라이트는 카드 바탕에 옅은 테두리, 다크는 바탕보다 한 단계 밝은 면이다. */
.fl-tabs button.on {
  font-weight: var(--weight-semibold);
  color: var(--color-fg);
  background: var(--color-node);
  box-shadow: 0 0 0 var(--border-thin) var(--color-plate-border);
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl-code {
  font-family: var(--font-mono);
}

.fl-caption {
  max-width: var(--size-caption-max);
  min-height: calc(var(--size-text-14) * var(--leading-normal));
  margin: 0;
  font-size: var(--size-text-14);
  line-height: var(--leading-normal);
  text-align: center;
  color: var(--color-muted);
}

.fl-full {
  position: absolute;
  top: var(--space-5);
  right: var(--space-5);
  z-index: var(--z-raised);
}

.fl-figure.full {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: flex;
  flex-direction: column;
  max-width: none;
  border-radius: 0;
}

.fl-figure.full .fl-canvas {
  display: grid;
  flex: 1;
  place-items: center;
}

.fl-figure.full .fl-canvas svg {
  width: 100%;
  height: calc(100vh - var(--size-embedded-chrome));
  max-height: none;
  touch-action: none;
  user-select: none;

.fl-figure.full.zoomed .fl-canvas svg {

.fl-figure.full.zoomed .fl-canvas svg:active {

}

/* 확대·축소는 전체 화면에서만 보인다. 문서 안에서는 그림을 그대로 보이는 편이 읽기 쉽다. */
.fl-zoom {

.fl-figure.full .fl-zoom {

<script>
// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다.
// 전체 화면과, 전체 화면에서만 켜지는 확대·축소·끌어 옮기기를 맡는다. 문서 안에서는 그림을 그대로 보인다.

// cost: time O(1) 시작, 휠·끌기마다 O(1), heap O(1), stack O(1)
// basis: estimate
/**
 * 그림 틀에 전체 화면 단추와 확대·축소를 붙인다.
 * @param root `.fl-figure` 요소. 안에 `.fl-full`, `.fl-zoom` 단추와 `svg.fl`이 있다
 * @param metrics { iconStroke, zoomMax, zoomStep }
 */
function figureView(root, metrics) {
  const svg = root.querySelector('svg.fl');
  const fullButton = root.querySelector('.fl-full');
  const base = svg.viewBox.baseVal;
  const home = { x: base.x, y: base.y, w: base.width, h: base.height };
  const icons = {
    open: 'M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4',
    close: 'M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4',
    in: 'M8 3v10M3 8h10',
    out: 'M3 8h10',
    fit: 'M3 3h10v10H3z',
  };
  let view = { ...home };
  let drag;

  fullButton.addEventListener('click', () => setFull(!root.classList.contains('full')));
  document.addEventListener('fullscreenchange', () => showFull(document.fullscreenElement === root));
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.fullscreenElement) setFull(false);
  });
  root.querySelectorAll('.fl-zoom button').forEach((b) => {
    b.innerHTML = drawIcon(icons[b.dataset.zoom]);
    b.addEventListener('click', () => (b.dataset.zoom === 'fit' ? setView(home) : zoomAt(b.dataset.zoom === 'in' ? metrics.zoomStep : 1 / metrics.zoomStep)));
  });
  svg.addEventListener('wheel', onWheel, { passive: false });
  svg.addEventListener('pointerdown', onPointerDown);
  svg.addEventListener('pointermove', onPointerMove);
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) svg.addEventListener(type, () => (drag = undefined));
  showFull(false);

  // 브라우저 전체 화면을 먼저 쓰고, 막혀 있으면(iframe에 allowfullscreen이 없을 때 등) 창을 덮는 모양으로 대신한다.
  function setFull(isFull) {
    const canUseApi = Boolean(root.requestFullscreen) && document.fullscreenEnabled;
    if (!canUseApi) return showFull(isFull);
    if (isFull) root.requestFullscreen().catch(() => showFull(true));
    else if (document.fullscreenElement) document.exitFullscreen();
    else showFull(false);
  }

  function showFull(isFull) {
    root.classList.toggle('full', isFull);
    fullButton.innerHTML = drawIcon(isFull ? icons.close : icons.open);
    const label = isFull ? '전체 화면 끝내기' : '전체 화면';
    fullButton.setAttribute('aria-label', label);
    fullButton.title = label;
    // 문서 안에서는 늘 전체 그림을 보인다.
    if (!isFull) setView(home);
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 휠을 굴린 자리를 중심으로 확대한다. 전체 화면이 아닐 때는 문서 스크롤에 맡긴다.
  function onWheel(e) {
    if (!root.classList.contains('full')) return;
    e.preventDefault();
    // 가로로만 미는 손짓은 확대·축소가 아니다.
    if (e.deltaY === 0) return;
    zoomAt(e.deltaY < 0 ? metrics.zoomStep : 1 / metrics.zoomStep, toSvgPoint(e));
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  function onPointerDown(e) {
    const isMainButton = e.button === 0;
    if (!root.classList.contains('full') || view.w >= home.w || !isMainButton) return;
    // 끄는 동안 viewBox가 바뀌므로, 잡은 순간의 화면→그림 변환으로 거리를 잰다.
    drag = { start: toSvgPoint(e), matrix: svg.getScreenCTM().inverse(), view: { ...view } };
    svg.setPointerCapture(e.pointerId);
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 끈 거리만큼 그림을 반대로 옮긴다. 잡은 자리가 손가락 아래에 머문다.
  function onPointerMove(e) {
    if (!drag) return;
    const now = new DOMPoint(e.clientX, e.clientY).matrixTransform(drag.matrix);
    setView({ ...drag.view, x: drag.view.x - (now.x - drag.start.x), y: drag.view.y - (now.y - drag.start.y) });
  }

  // factor만큼 확대한다. 배율은 1배(전체)에서 metrics.zoomMax배 사이다.
  function zoomAt(factor, center = { x: view.x + view.w / 2, y: view.y + view.h / 2 }) {
    const w = Math.min(home.w, Math.max(home.w / metrics.zoomMax, view.w / factor));
    const k = w / view.w;
    setView({ x: center.x - (center.x - view.x) * k, y: center.y - (center.y - view.y) * k, w, h: view.h * k });
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 그림 밖으로 벗어나지 않게 자리를 막고 viewBox에 쓴다.
  function setView(next) {
    const x = Math.min(home.x + home.w - next.w, Math.max(home.x, next.x));
    const y = Math.min(home.y + home.h - next.h, Math.max(home.y, next.y));
    view = { ...next, x, y };
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    root.classList.toggle('zoomed', view.w < home.w);
  }

  // 화면 좌표를 그림 좌표로 바꾼다. 그림 비율과 svg 상자 비율이 달라 생기는 여백까지 브라우저 변환 행렬이 반영한다.
  function toSvgPoint(e) {
    const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: point.x, y: point.y };
  }

  function drawIcon(d) {
    return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 16 16"><path d="${d}" fill="none" stroke="currentColor" stroke-width="${metrics.iconStroke}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
}

// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다.
// 시간표의 박자 상태를 그대로 그린다. 상태를 다시 계산하지 않는다(docs/architecture.md 불변 조건).

// cost: time O(s + c) 시작, 프레임마다 O(h + k), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수, h = 한 박자의 이동 수, k = 카드 있는 도형 수
// basis: estimate
/**
 * 재생기를 붙인다.
 * @param root `.fl-figure` 요소
 * @param data { segs, steps, cardCounts, edgeEnds, seriesCount, rowCount, metrics }
 */
function figurePlay(root, data) {
  const NS = 'http://www.w3.org/2000/svg';
  const RATES = [1, 2, 0.5];
  const BISECT_STEPS = 30;
  const ICON_VIEWBOX = '0 0 16 16';
  const svg = root.querySelector('svg.fl');
  const packetLayer = svg.querySelector('.fl-packets');
  const tabs = root.querySelector('.fl-tabs');
  const caption = root.querySelector('.fl-caption');
  const pauseButton = root.querySelector('.fl-pause');
  const pauseIcon = pauseButton.querySelector('.fl-pause-icon');
  const ringFill = pauseButton.querySelector('.fl-ring-fill');
  const ringLength = 2 * Math.PI * ringFill.r.baseVal.value;
  const rateButton = root.querySelector('.fl-rate');
  const nodes = data.cardCounts.map((_, i) => svg.querySelector(`#n-${i}`));
  const groups = [...svg.querySelectorAll('.fl-group')];
  const edges = data.edgeEnds.map((_, j) => svg.querySelector(`#e-${j}`));
  const paths = data.edgeEnds.map((_, j) => svg.querySelector(`#p-${j}`));
  const columns = [...svg.querySelectorAll('.fl-col')];
  const seriesEls = Array.from({ length: data.seriesCount }, (_, i) => [...svg.querySelectorAll(`.cs-${i}`)]);
  const labelEls = [...svg.querySelectorAll('.chart-label.shift')];
  const rowEls = Array.from({ length: data.rowCount }, (_, k) => [...svg.querySelectorAll(`.cr-${k}`)]);
  const { segs, metrics } = data;
  const stepSegs = data.steps.map((_, si) => segs.filter((s) => s.si === si));
  const buttons = data.steps.map(createTab);
  const hasCaption = segs.some((s) => s.caption);

  let index = 0;
  let elapsed = 0;
  let before = performance.now();
  let isPlaying = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rate = RATES[0];
  let packets = [];
  let pendingCards = [];

  pauseButton.addEventListener('click', () => setPlaying(!isPlaying));
  rateButton.addEventListener('click', () => {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
    rateButton.textContent = `${rate}×`;
  });
  root.addEventListener('keydown', (e) => {
    // 단추 위의 스페이스는 그 단추를 누르는 키다.
    if (e.key === ' ' && !e.target.closest('button')) {
      setPlaying(!isPlaying);
      e.preventDefault();
    }
  });
  ringFill.style.strokeDasharray = ringLength;
  highlightOnHover();
  figureView(root, metrics);

  setPlaying(isPlaying);
  if (segs.length) {
    enterSegment(0);
    requestAnimationFrame(drawFrame);
  } else {
    // 시간 흐름이 없는 그림은 조작 막대를 숨긴다. 차트는 SVG 이미지처럼 되풀이해 자란다.
    root.querySelector('.fl-foot').hidden = true;
    svg.classList.add('chart-loop');
  }

  // cost: time O(n), heap O(n), stack O(1)
  // vars: n = 글자 수
  // basis: estimate
  // 글을 백틱 기준으로 나눠 노드 목록으로 만든다. 홀수 번째 구간(백틱 안)은 makeCode가 만든 요소에 담는다.
  function richNodes(text, makeCode) {
    return text
      .split('`')
      .map((part, i) => {
        if (!part) return null;
        if (i % 2 === 0) return document.createTextNode(part);
        const code = makeCode();
        code.textContent = part;
        return code;
      })
      .filter(Boolean);
  }

  // cost: time O(n), heap O(n), stack O(1)
  // vars: n = 글자 수
  // basis: estimate
  function htmlCode() {
    const code = document.createElement('code');
    code.className = 'fl-code';
    return code;
  }

  // cost: time O(s), heap O(1), stack O(1)
  // vars: s = 박자 수
  // basis: estimate
  function createTab(label, si) {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.append(...richNodes(label, htmlCode));
    button.addEventListener('click', () => enterSegment(segs.indexOf(stepSegs[si][0])));
    tabs.appendChild(button);
    return button;
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 재생 단추 아이콘. shape은 16x16 좌표계의 SVG 도형 조각이다.
  function iconSvg(shape) {
    return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="${ICON_VIEWBOX}">${shape}</svg>`;
  }

  function setPlaying(value) {
    isPlaying = value;
    pauseIcon.innerHTML = iconSvg(
      isPlaying
        ? `<path d="M5 2.5v11M11 2.5v11" stroke="currentColor" stroke-width="${metrics.pauseStroke}" stroke-linecap="round"/>`
        : '<path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/>',
    );
    pauseButton.setAttribute('aria-label', isPlaying ? '일시정지' : '재생');
  }

  // cost: time O(n·c), heap O(n·c), stack O(1)
  // vars: n = 도형 수, c = 선 수
  // basis: estimate
  // 도형에 마우스를 올리면 닿은 선을 밝힌다. 조용한 선도 그때 보인다.
  function highlightOnHover() {
    nodes.forEach((g, i) => {
      const touching = data.edgeEnds.map((e, j) => (e[0] === i || e[1] === i ? edges[j] : null)).filter(Boolean);
      g?.addEventListener('mouseenter', () => touching.forEach((e) => e.classList.add('hover')));
      g?.addEventListener('mouseleave', () => touching.forEach((e) => e.classList.remove('hover')));
    });
  }

  // cost: time O(s + c + k + r), heap O(h), stack O(1)
  // vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수, h = 이동 수
  // basis: estimate
  // 박자 i의 상태를 그린다. 점이 도착하는 도형의 카드는 cardsAt 시각에 바뀐다.
  function enterSegment(i) {
    index = i;
    elapsed = 0;
    const seg = segs[i];
    nodes.forEach((g, n) => g?.classList.toggle('on', seg.nodesOn.includes(n)));
    groups.forEach((g, n) => g.classList.toggle('on', seg.groupsOn.includes(n)));
    edges.forEach((e, j) => e?.classList.toggle('on', seg.edgesOn.includes(j)));
    columns.forEach((c) => c.classList.toggle('on', seg.columnsOn.includes(c.dataset.col)));
    showCards(seg.cardsBefore);
    pendingCards = Object.entries(seg.cardsAt).map(([n, at]) => ({ n: Number(n), at }));
    drawChartState(seg);
    caption.replaceChildren(...richNodes(seg.caption, htmlCode));
    caption.hidden = !hasCaption;
    buttons.forEach((b, si) => {
      const isCurrent = si === seg.si;
      b.classList.toggle('on', isCurrent);
      b.setAttribute('aria-selected', isCurrent);
    });
    packets.forEach((p) => p.remove());
    packets = seg.hops.map(createPacket);
    packets.forEach((packet) => packet.move(0));
    drawRing(seg);
  }

  // cost: time O(k), heap O(1), stack O(1)
  // vars: k = 카드 있는 도형 수
  // basis: estimate
  function showCards(cards, only) {
    data.cardCounts.forEach((count, n) => {
      if (!count || (only !== undefined && only !== n)) return;
      const shown = cards[n];
      for (let k = 0; k < count; k++) svg.querySelector(`#n-${n}-c${k}`).setAttribute('opacity', shown === k ? 1 : 0);
      nodes[n].querySelector('.fl-empty').setAttribute('opacity', shown === undefined ? 1 : 0);
      nodes[n].querySelector('.fl-card').classList.toggle('on', shown !== undefined);
    });
  }

  // cost: time O(r + s), heap O(1), stack O(1)
  // vars: r = 차트 행 수, s = 계열 수
  // basis: estimate
  // 차트: 드러낸 계열을 보이고, 이 박자에 드러내는 계열은 자라는 움직임을 다시 건다. light가 있으면 나머지 행을 흐린다.
  function drawChartState(seg) {
    seriesEls.forEach((els, s) => {
      const isGrowing = seg.growing.includes(s);
      for (const el of els) {
        el.classList.toggle('hidden', !seg.series.includes(s));
        el.classList.remove('play');
        if (isGrowing) {
          el.getBoundingClientRect();
          el.classList.add('play');
        }
      }
    });
    labelEls.forEach((el, k) => el.style.setProperty('--label-shift', `${seg.labelShifts[k] ?? 0}px`));
    rowEls.forEach((els, k) => els.forEach((el) => el.classList.toggle('dim', seg.lights.length > 0 && !seg.lights.includes(k))));
  }

  // cost: time O(l), heap O(l), stack O(1)
  // vars: l = 글 상자 줄 수
  // basis: estimate
  // 점과 글 상자. 글 상자 줄과 자리는 시간표가 움직이는 SVG와 같게 정해 넘긴다.
  function createPacket(hop) {
    const path = paths[hop.edge];
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'fl-packet');
    g.innerHTML = `<circle r="${metrics.halo}" fill="${metrics.accent}" opacity="${metrics.haloOpacity}"/><circle r="${metrics.packet}" fill="${metrics.accent}"/>`;
    packetLayer.appendChild(g);
    const chip = hop.data ? createChip(hop.data) : undefined;
    if (chip) g.appendChild(chip.g);
    const length = path.getTotalLength();
    const slide = chipSlide(hop);
    return {
      remove: () => g.remove(),
      move(t) {
        const p = Math.min(1, t / hop.ms);
        const eased = progressAt(metrics.move, p);
        const point = path.getPointAtLength(length * (hop.isBack ? 1 - eased : eased));
        g.setAttribute('transform', `translate(${point.x} ${point.y})`);
        if (chip) chip.g.setAttribute('transform', `translate(${slide(p)})`);
        g.style.opacity = p >= 1 ? 0 : 1;
      },
    };
  }

  // cost: time O(l), heap O(l), stack O(1)
  // vars: l = 글 상자 줄 수
  // basis: estimate
  function createChip(lines) {
    const chip = document.createElementNS(NS, 'g');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('rx', metrics.chipRadius);
    rect.setAttribute('fill', metrics.chipFill);
    chip.appendChild(rect);
    const texts = lines.map((line) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'chip');
      t.append(...richNodes(line, () => {
        const code = document.createElementNS(NS, 'tspan');
        code.setAttribute('class', 'code');
        return code;
      }));
      chip.appendChild(t);
      return t;
    });
    packetLayer.appendChild(chip);
    const w = Math.max(...texts.map((t) => t.getComputedTextLength())) + metrics.chipPadX;
    const h = texts.length * metrics.chipLine + metrics.chipPadY;
    const top = -h - metrics.chipGap;
    rect.setAttribute('x', -w / 2);
    rect.setAttribute('y', top);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    texts.forEach((t, li) => t.setAttribute('y', top + metrics.chipLine * (li + 1)));
    return { g: chip, w, h };
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 베지어 곡선의 한 축 값. 매개변수 t의 제어점 a, b로 구한다.
  function bezierAxis(a, b, t) {
    return 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  }

  // cost: time O(STEPS), heap O(1), stack O(1)
  // vars: STEPS = BISECT_STEPS
  // basis: estimate
  // 곡선의 한 축 값이 target이 되는 매개변수 t를 이분 탐색으로 구한다.
  function solveBezier(a, b, target) {
    let [low, high] = [0, 1];
    for (let i = 0; i < BISECT_STEPS; i++) {
      const mid = (low + high) / 2;
      if (bezierAxis(a, b, mid) < target) low = mid;
      else high = mid;
    }
    return (low + high) / 2;
  }

  // cost: time O(STEPS), heap O(1), stack O(1)
  // vars: STEPS = BISECT_STEPS
  // basis: estimate
  // 시간 비율 p에서 이동 곡선의 진행 비율. easing.js의 timeAt과 같은 곡선을 반대 방향으로 푼다.
  function progressAt([x1, y1, x2, y2], p) {
    return bezierAxis(y1, y2, solveBezier(x1, x2, p));
  }

  // cost: time O(STEPS·k), 프레임마다 O(k), heap O(k), stack O(1)
  // vars: STEPS = 이분 탐색 횟수(30), k = 경로 지점 수(21)
  // basis: estimate
  // 글 상자 옮김. 빌드 때 시간표에 담은 경로 지점별 옮김 [진행 비율, dx, dy]를 움직이는 SVG의 옮김 움직임(SMIL, 지점이 점에 닿는 시각 사이를 선형)과 같게 시간 비율 p에서 보간한다.
  function chipSlide(hop) {
    const path = hop.chipPath ?? [];
    const times = path.map(([at]) => timeAtProgress(metrics.move, at));
    return (p) => {
      if (!path.length) return '0 0';
      const k = times.findLastIndex((time) => time <= p);
      if (k < 0) return `${path[0][1]} ${path[0][2]}`;
      if (k === path.length - 1) return `${path[k][1]} ${path[k][2]}`;
      const ratio = times[k + 1] > times[k] ? (p - times[k]) / (times[k + 1] - times[k]) : 1;
      return `${path[k][1] + (path[k + 1][1] - path[k][1]) * ratio} ${path[k][2] + (path[k + 1][2] - path[k][2]) * ratio}`;
    };
  }

  // cost: time O(STEPS), heap O(1), stack O(1)
  // vars: STEPS = BISECT_STEPS
  // basis: estimate
  // 진행 비율 f에 닿는 시간 비율. easing.js의 timeAt과 같다.
  function timeAtProgress([x1, y1, x2, y2], f) {
    return bezierAxis(x1, x2, solveBezier(y1, y2, f));
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 재생 단추 둘레 고리를 현재 탭(장면)의 진행 비율만큼 채운다. 12시에서 시계 방향이고, 멈추면 그 자리에 머문다.
  function drawRing(seg) {
    ringFill.style.strokeDashoffset = ringLength * (1 - tabProgress(seg));
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 박자 seg가 속한 탭(step) 전체 시간 중 지금까지 지난 비율(0~1).
  function tabProgress(seg) {
    const steps = stepSegs[seg.si];
    const start = steps[0].t0;
    const end = steps.at(-1).t1;
    return (seg.t0 - start + Math.min(elapsed, seg.t1 - seg.t0)) / (end - start);
  }

  // cost: time O(h + k), heap O(1), stack O(1)
  // vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
  // basis: estimate
  // 프레임마다 점을 옮기고, 도착한 도형의 카드를 바꾸고, 재생 단추 고리를 채운다.
  function drawFrame(now) {
    if (isPlaying) elapsed += (now - before) * rate;
    before = now;
    const seg = segs[index];
    packets.forEach((packet) => packet.move(elapsed));
    pendingCards = pendingCards.filter(({ n, at }) => {
      if (elapsed < at) return true;
      showCards(seg.cards, n);
      return false;
    });
    drawRing(seg);
    if (elapsed >= seg.t1 - seg.t0) enterSegment((index + 1) % segs.length);
    requestAnimationFrame(drawFrame);
  }
}
