<title>장기 기억 정확도</title>
<script>if (window.self !== window.top) {
  document.documentElement.classList.add('embedded');
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !('theme' in e.data)) return;
    const root = document.documentElement;
    if (e.data.theme === 'light' || e.data.theme === 'dark') {
      root.setAttribute('data-theme', e.data.theme);
      root.style.colorScheme = e.data.theme;
    } else {
      root.removeAttribute('data-theme');
      root.style.colorScheme = '';
    }
  });
  parent.postMessage({ themeRequest: true }, '*');
  addEventListener('load', () => new ResizeObserver(() => parent.postMessage({ figureHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*')).observe(document.body));
}</script>

/* 재생기 틀과 조작 막대. iframe 안(html.embedded)에서는 테두리와 바깥 여백을 뺀다. */
body {
  margin: 0;
  padding: var(--space-12);
  font-family: var(--font-sans);
  background: var(--color-page);
}

/* 목록 쪽 카드 안은 틀이 카드 너비를 다 채워 양옆이 비치지 않게 하고, 바탕은 재생기 쪽과 같은 색으로 둔다. */
html.embedded body {
  padding: 0;
  background: var(--color-bg);
}

.fl-figure {
  position: relative;
  max-width: calc(var(--size-figure-canvas) + var(--space-12) + var(--border-thin) * 2);
  margin: 0 auto;
  overflow: hidden;
  color: var(--color-fg);
  background: var(--color-bg);
  border: var(--border-thin) solid var(--color-frame);
  border-radius: var(--radius-2xl);
}

html.embedded .fl-figure {
  max-width: none;
  border: 0;
  border-radius: 0;
}

/* 카드 전체가 그림 판 한 덩어리다. 제목 줄, 그림 영역, 조작 줄이 모두 color.bg 한 톤이라 숫자 둘레 halo와 선 라벨 알약도 그대로 맞는다. */
.fl-canvas {
  padding: var(--space-6);
  background: var(--color-bg);
  overflow: auto;
}

.fl-canvas svg {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100vh - var(--size-player-chrome));
  margin: 0 auto;
}

/* iframe 높이는 목록 쪽이 문서 높이에 맞춘다. 화면 높이로 줄이면 서로 맞추다 계속 작아진다. */
html.embedded .fl-canvas svg {
  max-height: none;
}

.fl-foot {
  display: grid;
  gap: var(--space-6);
  justify-items: center;
  padding: var(--space-7) var(--space-8) var(--space-8);
  background: var(--color-bg);
  border-top: var(--border-thin) solid var(--color-frame);
}

.fl-bar {
  display: flex;
  gap: var(--space-5);
  align-items: center;
}

.fl-round {
  display: grid;
  place-items: center;
  min-width: var(--size-control);
  height: var(--size-control);
  padding: 0 var(--space-3-5);
  font: var(--size-text-11) var(--font-mono);
  white-space: nowrap;
  color: var(--color-muted);
  background: var(--color-node);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-full);
  cursor: pointer;
}

.fl-round:focus-visible,
.fl-tabs button:focus-visible {
  outline: var(--border-tag) solid var(--color-accent);
  outline-offset: var(--space-1);
}

.fl-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  justify-content: center;
  padding: var(--space-1-5);
  background: var(--color-node);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-xl);
}

.fl-tabs button {
  position: relative;
  padding: var(--space-3) var(--space-7);
  font: var(--size-text-13) var(--font-mono);
  color: var(--color-muted);
  background: transparent;
  border: 0;
  border-radius: var(--radius-md);
  cursor: pointer;
}

.fl-tabs button.on {
  color: var(--color-fg);
  background: color-mix(in srgb, var(--color-fg) calc(var(--opacity-tab-on) * 100%), transparent);
}

.fl-tabs button i {
  position: absolute;
  bottom: var(--space-1);
  left: var(--space-7);
  width: 0;
  max-width: calc(100% - var(--space-14));
  height: var(--space-1);
  background: var(--color-accent);
  border-radius: var(--radius-xs);
}

.fl-caption {
  max-width: var(--size-caption-max);
  min-height: calc(var(--size-text-14-5) * var(--leading-normal));
  margin: 0;
  font-size: var(--size-text-14-5);
  line-height: var(--leading-normal);
  text-align: center;
  color: var(--color-muted);
}

.fl-full {
  position: absolute;
  top: var(--space-5);
  right: var(--space-5);
  z-index: var(--z-raised);
}

.fl-figure.full {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: flex;
  flex-direction: column;
  max-width: none;
  border-radius: 0;
}

.fl-figure.full .fl-canvas {
  display: grid;
  flex: 1;
  place-items: center;
}

.fl-figure.full .fl-canvas svg {
  width: 100%;
  height: calc(100vh - var(--size-embedded-chrome));
  max-height: none;
  touch-action: none;
  user-select: none;
}

.fl-figure.full.zoomed .fl-canvas svg {
  cursor: grab;
}

.fl-figure.full.zoomed .fl-canvas svg:active {
  cursor: grabbing;
}

/* 확대·축소는 전체 화면에서만 보인다. 문서 안에서는 그림을 그대로 보이는 편이 읽기 쉽다. */
.fl-zoom {
  position: absolute;
  top: calc(var(--space-5) + var(--size-control) + var(--space-3));
  right: var(--space-5);
  z-index: var(--z-raised);
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.fl-figure.full .fl-zoom {
  display: flex;
}

.fl .fl-node.on .fl-stroke {
  stroke: var(--color-accent);
}

.fl .fl-card.on {
  fill: var(--color-card-on);
  stroke: var(--color-accent);
}

.fl .fl-edge.on .fl-path,
.fl .fl-edge.hover .fl-path {
  stroke: var(--color-accent);
  stroke-width: var(--border-strong);
}

.fl .fl-edge.on .fl-path[marker-end],
.fl .fl-edge.hover .fl-path[marker-end] {
  marker-end: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-path[marker-start],
.fl .fl-edge.hover .fl-path[marker-start] {
  marker-start: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-pill rect {
  fill: var(--color-accent);
  stroke: var(--color-accent);
}

.fl .fl-edge.on .fl-pill text {
  fill: var(--color-on-accent);
}

.fl .fl-path,
.fl .fl-stroke,
.fl .fl-pill rect {
  transition: stroke var(--duration-fast), fill var(--duration-fast);
}

.fl .fl-layer,
.fl .fl-edge.quiet {
  transition: opacity var(--duration-fast);
}

/* 조용한 선은 지금 단계에서 쓰거나 마우스를 올린 도형에 닿을 때만 보인다. */
.fl .fl-edge.quiet:not(.on, .hover) {
  opacity: 0;
}

.fl .fl-node {
  cursor: default;
}

.fl-packet {
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .fl .fl-path,
  .fl .fl-stroke,
  .fl .fl-pill rect,
  .fl .fl-layer,
  .fl .fl-edge.quiet {
    transition: none;
  }
}

.fl .fl-group.on .fl-stroke {
  stroke: var(--color-accent);
}

.fl .fl-col.on .col-bg {
  fill: var(--color-card-on);
}

/* hidden 속성이 display: grid 같은 규칙에 지지 않게 한다. 시간 흐름 없는 그림의 빈 조작 막대를 숨기기 위해서다. */
[hidden] {
  display: none !important;
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
.fl text {
  font-family: var(--font-sans);
}

.fl .label {

  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .sub {
  font-size: var(--size-text-12);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .frame {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-frame);
  fill: var(--color-muted);
}

.fl .edgelabel {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .row {
  font-size: var(--size-text-11);
  fill: var(--color-fg);
}

.fl .row.mono {
  font-family: var(--font-mono);
  font-size: var(--size-text-10-5);
}

.fl .muted {
  fill: var(--color-muted);
}

.fl .tag {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tag);
  text-anchor: middle;
}

.fl .mark {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-accent);
}

.fl .mark.key {
  font-size: var(--size-text-9);
  text-anchor: start;
}

.fl .mini {
  font-size: var(--size-text-10-5);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mini.on {
  fill: var(--color-on-accent);
}

.fl .chip {
  font-size: var(--size-text-11-5);
  text-anchor: middle;
  fill: var(--color-on-accent);
}

.fl .md {
  font-size: var(--size-text-13);
  fill: var(--color-fg);
}

.fl .md.h {
  font-size: var(--size-text-15);
  font-weight: var(--weight-semibold);
}

.fl .cell {
  font-size: var(--size-text-11-5);
  fill: var(--color-fg);
}

.fl .cell.type {
  font-family: var(--font-mono);
  font-size: var(--size-text-10-5);
  text-anchor: end;
  fill: var(--color-muted);
}

.fl .fl-stroke {
  stroke: var(--color-border);
}

.fl .fl-path {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}

.fl .cell .key {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  fill: var(--color-accent);
}

.fl .frame-box {
  fill: var(--color-group);
  stroke: var(--color-group-border);
}

.fl .lifeline {
  stroke: var(--color-border);
  stroke-width: var(--border-lifeline);
  stroke-dasharray: var(--dash-gap) var(--dash-gap);
}

.fl .note-box {
  fill: var(--color-surface);
  stroke: var(--color-border);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .pill {
  fill: var(--color-bg);
  stroke: var(--color-border);
}

.fl .col-bg {
  fill: transparent;
}

.fl .col-line {
  stroke: var(--color-border);
  stroke-width: var(--border-hair);
}

.fl .fl-edge.mark .fl-path {
  stroke: var(--color-fg);
}
/* 차트 글자와 자라는 움직임. 차트 SVG 안에 들어가고, README 이미지에서도 보이게 되풀이한다. */
.fl .chart-title {
  font-size: var(--size-text-15);
  font-weight: var(--weight-semibold);
  fill: var(--color-fg);
}

.fl .chart-legend,
.fl .chart-label {
  font-size: var(--size-text-13);
  fill: var(--color-fg);
}

.fl .chart-legend {
  font-size: var(--size-text-12);
  fill: var(--color-muted);
}

.fl .chart-value,
.fl .chart-tick,
.fl .chart-unit {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
  fill: var(--color-muted);
}

.fl .chart-value {
  paint-order: stroke;
  stroke: var(--color-bg);
  stroke-width: var(--border-halo);
  stroke-linejoin: round;
}

.fl .chart-tick {
  text-anchor: middle;
}

.fl .chart-unit {
  text-anchor: end;
}

.fl .chart-value.start {
  text-anchor: start;
}

.fl .chart-value.end {
  text-anchor: end;
}

.fl .chart-value.ours {
  font-weight: var(--weight-semibold);
  fill: var(--color-accent);
}

.fl .chart-value.first {
  fill: var(--color-series-1);
}

.fl .chart-value.second {
  font-weight: var(--weight-semibold);
  fill: var(--color-series-2);
}

.fl .chart-name.end {
  text-anchor: end;
}

.fl .chart-missing {
  font-size: var(--size-text-11);
  font-style: italic;
  fill: var(--color-muted);
}

.fl .chart-ratio {
  font-family: var(--font-mono);
  font-size: var(--size-text-12);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-accent);
}

.fl .chart-sub,
.fl .chart-name,
.fl .chart-rule-label {
  font-size: var(--size-text-12);
  fill: var(--color-muted);
}

.fl .chart-name,
.fl .chart-rule-label {
  font-size: var(--size-text-11);
}

.fl .chart-tick.end,
.fl .chart-rule-label.end {
  text-anchor: end;
}

.fl .chart-unit.start {
  text-anchor: start;
}

/* 칸 색은 변수로 계산해 다크 모드 heat-low를 따라간다. --s는 칸 강도(0~1)다. */
.fl .chart-heat {
  fill: color-mix(in srgb, var(--color-heat-high) calc(var(--s) * 100%), var(--color-heat-low));
}

.fl .chart-cell {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-heat-ink);
}

.fl .chart-cell.on {
  fill: var(--color-heat-ink-on);
}

.fl .chart-axis,
.fl .chart-grid {
  stroke: var(--color-grid);
  stroke-width: var(--border-thin);
}

.fl .chart-rule {
  stroke: var(--color-muted);
  stroke-width: var(--border-thin);
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .chart-whisker,
.fl .chart-median {
  stroke: var(--color-fg);
  stroke-width: var(--border-tag);
}

.fl .chart-ci {
  stroke: var(--color-fg);
  stroke-width: var(--border-strong);
}

.fl .chart-interval {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}

.fl .chart-band {
  fill-opacity: var(--opacity-band);
}

.fl .chart-range {
  stroke-linecap: round;
  stroke-opacity: var(--opacity-range);
}

.fl .chart-after {
  stroke: var(--color-bg);
  stroke-width: var(--border-tag);
}

.fl .chart-box {
  fill: var(--color-node);
  stroke: var(--color-series-1);
  stroke-width: var(--border-tag);
}

.fl .chart-before {
  fill: var(--color-bg);
  stroke: var(--color-series-1);
  stroke-width: var(--border-tag);
}

.fl .chart-arrow,
.fl .chart-link {
  stroke: var(--color-series-2);
  stroke-width: var(--border-strong);
}

.fl .chart-link {
  stroke: var(--color-muted);
  stroke-width: var(--border-strong);
  stroke-linecap: round;
}

.fl .chart-label.shift {
  transform: translateY(var(--label-shift));
  transition: transform var(--duration-fast);
}

/* pathLength 1인 선이 stroke-dashoffset으로 그려진다. 선 차트의 선, 덤벨 화살표, 산점도 link가 함께 쓴다. */
.fl .draw {
  stroke-dasharray: 1;
}

.fl .grow {
  transform-box: fill-box;
  transform-origin: left center;
}

.fl .hidden {
  opacity: 0;
}

.fl .dim {
  opacity: var(--opacity-dim);
}

.fl .cs-0,
.fl .cs-1,
.fl [class*="cr-"] {
  transition: opacity var(--duration-fast);
}

.fl .play .dot, .fl .play.dot { animation: chart-dot 200ms var(--easing-reveal) both; }
@keyframes chart-dot { from { opacity: 0; } }

.fl .play .grow, .fl .play.grow { animation: chart-grow 900ms var(--easing-reveal) both; }
.fl .play .draw, .fl .play.draw { animation: chart-draw 900ms var(--easing-reveal) both; }
.fl .play .wipe, .fl .play.wipe { animation: chart-wipe 900ms var(--easing-reveal) both; }
.fl .play .pop, .fl .play.pop, .fl .play .late, .fl .play.late { animation: chart-fade 900ms var(--easing-reveal) both; }
.fl.chart-loop .grow { animation: chart-grow-loop 7000ms infinite both; }
.fl.chart-loop .draw { animation: chart-draw-loop 7000ms infinite both; }
.fl.chart-loop .wipe { animation: chart-wipe-loop 7000ms infinite both; }
.fl.chart-loop .pop, .fl.chart-loop .late { animation: chart-fade-loop 7000ms infinite both; }
@keyframes chart-grow { from { transform: scaleX(0); } }
@keyframes chart-draw { from { stroke-dashoffset: 1; } }
@keyframes chart-wipe { from { clip-path: inset(0 100% 0 0); } }
@keyframes chart-fade { 0%, 50% { opacity: 0; } }
@keyframes chart-grow-loop { 0% { transform: scaleX(0); animation-timing-function: var(--easing-reveal); } 12.86%, 100% { transform: none; } }
@keyframes chart-draw-loop { 0% { stroke-dashoffset: 1; animation-timing-function: var(--easing-reveal); } 12.86%, 100% { stroke-dashoffset: 0; } }
@keyframes chart-wipe-loop { 0% { clip-path: inset(0 100% 0 0); animation-timing-function: var(--easing-reveal); } 12.86%, 100% { clip-path: inset(0 0 0 0); } }
@keyframes chart-fade-loop { 0%, 6.43% { opacity: 0; animation-timing-function: var(--easing-reveal); } 12.86%, 100% { opacity: 1; } }
</style>

<g class="cr-2"><g class="cs-0"><text x="786.5" y="219" class="chart-value ours late">85</text></g></g>
<g class="cr-3"><g class="cs-0"><text x="808.1" y="269" class="chart-value ours late">88.5</text></g></g>
<g class="cr-3"><g class="cs-1"><text x="690.4" y="285" class="chart-value late">70.3</text></g></g>
<line x1="168" x2="864" y1="295" y2="295" class="chart-axis"/><text x="168" y="312" class="chart-tick">0</text><text x="307.2" y="312" class="chart-tick">20</text><text x="446.4" y="312" class="chart-tick">40</text><text x="585.6" y="312" class="chart-tick">60</text><text x="724.8" y="312" class="chart-tick">80</text><text x="864" y="312" class="chart-tick">100</text><text x="864" y="329" class="chart-unit">정확도(%)</text><g class="fl-packets"></g></svg></div>
<figcaption class="fl-foot">
<div class="fl-bar"><button type="button" class="fl-round fl-pause"></button><div class="fl-tabs" role="tablist"></div><button type="button" class="fl-round fl-rate" aria-label="배속">1×</button></div>
<p class="fl-caption" aria-live="polite"></p>

</figure>
<script>
// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다.
// 전체 화면과, 전체 화면에서만 켜지는 확대·축소·끌어 옮기기를 맡는다. 문서 안에서는 그림을 그대로 보인다.

// cost: time O(1) 시작, 휠·끌기마다 O(1), heap O(1), stack O(1)
// basis: estimate
/**
 * 그림 틀에 전체 화면 단추와 확대·축소를 붙인다.
 * @param root `.fl-figure` 요소. 안에 `.fl-full`, `.fl-zoom` 단추와 `svg.fl`이 있다
 * @param metrics { iconStroke, zoomMax, zoomStep }
 */
function figureView(root, metrics) {
  const svg = root.querySelector('svg.fl');
  const fullButton = root.querySelector('.fl-full');
  const base = svg.viewBox.baseVal;
  const home = { x: base.x, y: base.y, w: base.width, h: base.height };
  const icons = {
    open: 'M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4',
    close: 'M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4',
    in: 'M8 3v10M3 8h10',
    out: 'M3 8h10',
    fit: 'M3 3h10v10H3z',
  };
  let view = { ...home };
  let drag;

  fullButton.addEventListener('click', () => setFull(!root.classList.contains('full')));
  document.addEventListener('fullscreenchange', () => showFull(document.fullscreenElement === root));
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.fullscreenElement) setFull(false);
  });
  root.querySelectorAll('.fl-zoom button').forEach((b) => {
    b.innerHTML = drawIcon(icons[b.dataset.zoom]);
    b.addEventListener('click', () => (b.dataset.zoom === 'fit' ? setView(home) : zoomAt(b.dataset.zoom === 'in' ? metrics.zoomStep : 1 / metrics.zoomStep)));
  });
  svg.addEventListener('wheel', onWheel, { passive: false });
  svg.addEventListener('pointerdown', onPointerDown);
  svg.addEventListener('pointermove', onPointerMove);
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) svg.addEventListener(type, () => (drag = undefined));
  showFull(false);

  // 브라우저 전체 화면을 먼저 쓰고, 막혀 있으면(iframe에 allowfullscreen이 없을 때 등) 창을 덮는 모양으로 대신한다.
  function setFull(isFull) {
    const canUseApi = Boolean(root.requestFullscreen) && document.fullscreenEnabled;
    if (!canUseApi) return showFull(isFull);
    if (isFull) root.requestFullscreen().catch(() => showFull(true));
    else if (document.fullscreenElement) document.exitFullscreen();
    else showFull(false);
  }

  function showFull(isFull) {
    root.classList.toggle('full', isFull);
    fullButton.innerHTML = drawIcon(isFull ? icons.close : icons.open);
    const label = isFull ? '전체 화면 끝내기' : '전체 화면';
    fullButton.setAttribute('aria-label', label);
    fullButton.title = label;
    // 문서 안에서는 늘 전체 그림을 보인다.
    if (!isFull) setView(home);
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 휠을 굴린 자리를 중심으로 확대한다. 전체 화면이 아닐 때는 문서 스크롤에 맡긴다.
  function onWheel(e) {
    if (!root.classList.contains('full')) return;
    e.preventDefault();
    // 가로로만 미는 손짓은 확대·축소가 아니다.
    if (e.deltaY === 0) return;
    zoomAt(e.deltaY < 0 ? metrics.zoomStep : 1 / metrics.zoomStep, toSvgPoint(e));
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  function onPointerDown(e) {
    const isMainButton = e.button === 0;
    if (!root.classList.contains('full') || view.w >= home.w || !isMainButton) return;
    // 끄는 동안 viewBox가 바뀌므로, 잡은 순간의 화면→그림 변환으로 거리를 잰다.
    drag = { start: toSvgPoint(e), matrix: svg.getScreenCTM().inverse(), view: { ...view } };
    svg.setPointerCapture(e.pointerId);
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 끈 거리만큼 그림을 반대로 옮긴다. 잡은 자리가 손가락 아래에 머문다.
  function onPointerMove(e) {
    if (!drag) return;
    const now = new DOMPoint(e.clientX, e.clientY).matrixTransform(drag.matrix);
    setView({ ...drag.view, x: drag.view.x - (now.x - drag.start.x), y: drag.view.y - (now.y - drag.start.y) });
  }

  // factor만큼 확대한다. 배율은 1배(전체)에서 metrics.zoomMax배 사이다.
  function zoomAt(factor, center = { x: view.x + view.w / 2, y: view.y + view.h / 2 }) {
    const w = Math.min(home.w, Math.max(home.w / metrics.zoomMax, view.w / factor));
    const k = w / view.w;
    setView({ x: center.x - (center.x - view.x) * k, y: center.y - (center.y - view.y) * k, w, h: view.h * k });
  }

  // cost: time O(1), heap O(1), stack O(1)
  // basis: estimate
  // 그림 밖으로 벗어나지 않게 자리를 막고 viewBox에 쓴다.
  function setView(next) {
    const x = Math.min(home.x + home.w - next.w, Math.max(home.x, next.x));
    const y = Math.min(home.y + home.h - next.h, Math.max(home.y, next.y));
    view = { ...next, x, y };
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    root.classList.toggle('zoomed', view.w < home.w);
  }

  // 화면 좌표를 그림 좌표로 바꾼다. 그림 비율과 svg 상자 비율이 달라 생기는 여백까지 브라우저 변환 행렬이 반영한다.
  function toSvgPoint(e) {
    const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: point.x, y: point.y };
  }

  function drawIcon(d) {
    return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 16 16"><path d="${d}" fill="none" stroke="currentColor" stroke-width="${metrics.iconStroke}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
}

// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다.
// 시간표의 박자 상태를 그대로 그린다. 상태를 다시 계산하지 않는다(docs/architecture.md 불변 조건).

// cost: time O(s + c) 시작, 프레임마다 O(h + k), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수, h = 한 박자의 이동 수, k = 카드 있는 도형 수
// basis: estimate
/**
 * 재생기를 붙인다.
 * @param root `.fl-figure` 요소
 * @param data { segs, steps, cardCounts, edgeEnds, seriesCount, rowCount, metrics }
 */
function figurePlay(root, data) {
  const NS = 'http://www.w3.org/2000/svg';
  const RATES = [1, 2, 0.5];
  const svg = root.querySelector('svg.fl');
  const packetLayer = svg.querySelector('.fl-packets');
  const tabs = root.querySelector('.fl-tabs');
  const caption = root.querySelector('.fl-caption');
  const pauseButton = root.querySelector('.fl-pause');
  const rateButton = root.querySelector('.fl-rate');
  const nodes = data.cardCounts.map((_, i) => svg.querySelector(`#n-${i}`));
  const groups = [...svg.querySelectorAll('.fl-group')];
  const edges = data.edgeEnds.map((_, j) => svg.querySelector(`#e-${j}`));
  const paths = data.edgeEnds.map((_, j) => svg.querySelector(`#p-${j}`));
  const columns = [...svg.querySelectorAll('.fl-col')];
  const seriesEls = Array.from({ length: data.seriesCount }, (_, i) => [...svg.querySelectorAll(`.cs-${i}`)]);
  const rowEls = Array.from({ length: data.rowCount }, (_, k) => [...svg.querySelectorAll(`.cr-${k}`)]);
  const { segs, metrics } = data;
  const stepSegs = data.steps.map((_, si) => segs.filter((s) => s.si === si));
  const buttons = data.steps.map(createTab);
  const hasCaption = segs.some((s) => s.caption);

  let index = 0;
  let elapsed = 0;
  let before = performance.now();
  let isPlaying = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rate = RATES[0];
  let packets = [];
  let pendingCards = [];

  pauseButton.addEventListener('click', () => setPlaying(!isPlaying));
  rateButton.addEventListener('click', () => {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
    rateButton.textContent = `${rate}×`;
  });
  root.addEventListener('keydown', (e) => {
    // 단추 위의 스페이스는 그 단추를 누르는 키다.
    if (e.key === ' ' && !e.target.closest('button')) {
      setPlaying(!isPlaying);
      e.preventDefault();
    }
  });
  highlightOnHover();
  figureView(root, metrics);

  setPlaying(isPlaying);
  if (segs.length) {
    enterSegment(0);
    requestAnimationFrame(drawFrame);
  } else {
    // 시간 흐름이 없는 그림은 조작 막대를 숨긴다. 차트는 SVG 이미지처럼 되풀이해 자란다.
    root.querySelector('.fl-foot').hidden = true;
    svg.classList.add('chart-loop');
  }

  // cost: time O(s), heap O(1), stack O(1)
  // vars: s = 박자 수
  // basis: estimate
  function createTab(label, si) {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.append(label, document.createElement('i'));
    button.addEventListener('click', () => enterSegment(segs.indexOf(stepSegs[si][0])));
    tabs.appendChild(button);
    return button;
  }

  function setPlaying(value) {
    isPlaying = value;
    pauseButton.innerHTML = isPlaying
      ? `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 16 16"><path d="M5 2.5v11M11 2.5v11" stroke="currentColor" stroke-width="${metrics.pauseStroke}" stroke-linecap="round"/></svg>`
      : '<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>';
    pauseButton.setAttribute('aria-label', isPlaying ? '일시정지' : '재생');
  }

  // cost: time O(n·c), heap O(n·c), stack O(1)
  // vars: n = 도형 수, c = 선 수
  // basis: estimate
  // 도형에 마우스를 올리면 닿은 선을 밝힌다. 조용한 선도 그때 보인다.
  function highlightOnHover() {
    nodes.forEach((g, i) => {
      const touching = data.edgeEnds.map((e, j) => (e[0] === i || e[1] === i ? edges[j] : null)).filter(Boolean);
      g?.addEventListener('mouseenter', () => touching.forEach((e) => e.classList.add('hover')));
      g?.addEventListener('mouseleave', () => touching.forEach((e) => e.classList.remove('hover')));
    });
  }

  // cost: time O(s + c + k + r), heap O(h), stack O(1)
  // vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수, h = 이동 수
  // basis: estimate
  // 박자 i의 상태를 그린다. 점이 도착하는 도형의 카드는 cardsAt 시각에 바뀐다.
  function enterSegment(i) {
    index = i;
    elapsed = 0;
    const seg = segs[i];
    nodes.forEach((g, n) => g?.classList.toggle('on', seg.nodesOn.includes(n)));
    groups.forEach((g, n) => g.classList.toggle('on', seg.groupsOn.includes(n)));
    edges.forEach((e, j) => e?.classList.toggle('on', seg.edgesOn.includes(j)));
    columns.forEach((c) => c.classList.toggle('on', seg.columnsOn.includes(c.dataset.col)));
    showCards(seg.cardsBefore);
    pendingCards = Object.entries(seg.cardsAt).map(([n, at]) => ({ n: Number(n), at }));
    drawChartState(seg);
    caption.textContent = seg.caption;
    caption.hidden = !hasCaption;
    buttons.forEach((b, si) => {
      const isCurrent = si === seg.si;
      b.classList.toggle('on', isCurrent);
      b.setAttribute('aria-selected', isCurrent);
      // 탭을 옮겨도 앞 탭의 진행 막대가 남지 않게 지금 탭이 아닌 막대는 비운다.
      if (!isCurrent) b.querySelector('i').style.width = '0';
    });
    packets.forEach((p) => p.remove());
    packets = seg.hops.map(createPacket);
    packets.forEach((packet) => packet.move(0));
  }

  // cost: time O(k), heap O(1), stack O(1)
  // vars: k = 카드 있는 도형 수
  // basis: estimate
  function showCards(cards, only) {
    data.cardCounts.forEach((count, n) => {
      if (!count || (only !== undefined && only !== n)) return;
      const shown = cards[n];
      for (let k = 0; k < count; k++) svg.querySelector(`#n-${n}-c${k}`).setAttribute('opacity', shown === k ? 1 : 0);
      nodes[n].querySelector('.fl-empty').setAttribute('opacity', shown === undefined ? 1 : 0);
      nodes[n].querySelector('.fl-card').classList.toggle('on', shown !== undefined);
    });
  }

  // cost: time O(r + s), heap O(1), stack O(1)
  // vars: r = 차트 행 수, s = 계열 수
  // basis: estimate
  // 차트: 드러낸 계열을 보이고, 이 박자에 드러내는 계열은 자라는 움직임을 다시 건다. light가 있으면 나머지 행을 흐린다.
  function drawChartState(seg) {
    seriesEls.forEach((els, s) => {
      const isGrowing = seg.growing.includes(s);
      for (const el of els) {
        el.classList.toggle('hidden', !seg.series.includes(s));
        el.classList.remove('play');
        if (isGrowing) {
          el.getBoundingClientRect();
          el.classList.add('play');
        }
      }
    });
    svg.style.setProperty('--label-shift', `${seg.labelShift}px`);
    rowEls.forEach((els, k) => els.forEach((el) => el.classList.toggle('dim', seg.lights.length > 0 && !seg.lights.includes(k))));
  }

  // cost: time O(l), heap O(l), stack O(1)
  // vars: l = 글 상자 줄 수
  // basis: estimate
  // 점과 글 상자. 글 상자 줄은 html.js가 움직이는 SVG와 같은 너비로 나눠 넘긴다.
  function createPacket(hop) {
    const path = paths[hop.edge];
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'fl-packet');
    g.innerHTML = `<circle r="${metrics.halo}" fill="${metrics.accent}" opacity="${metrics.haloOpacity}"/><circle r="${metrics.packet}" fill="${metrics.accent}"/>`;
    packetLayer.appendChild(g);
    const chip = hop.data ? createChip(hop.data) : undefined;
    if (chip) g.appendChild(chip.g);
    const length = path.getTotalLength();
    return {
      remove: () => g.remove(),
      move(t) {
        const p = Math.min(1, t / hop.ms);
        const eased = progressAt(metrics.move, p);
        const point = path.getPointAtLength(length * (hop.isBack ? 1 - eased : eased));
        g.setAttribute('transform', `translate(${point.x} ${point.y})`);
        if (chip) placeChip(chip, point);
        g.style.opacity = p >= 1 ? 0 : 1;
      },
    };
  }

  // cost: time O(l), heap O(l), stack O(1)
  // vars: l = 글 상자 줄 수
  // basis: estimate
  function createChip(lines) {
    const chip = document.createElementNS(NS, 'g');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('rx', metrics.chipRadius);
    rect.setAttribute('fill', metrics.accent);
    chip.appendChild(rect);
    const texts = lines.map((line) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'chip');
      t.textContent = line;
      chip.appendChild(t);
      return t;
    });
    packetLayer.appendChild(chip);
    const w = Math.max(...texts.map((t) => t.getComputedTextLength())) + metrics.chipPadX;
    const h = texts.length * metrics.chipLine + metrics.chipPadY;
    const top = -h - metrics.chipGap;
    rect.setAttribute('x', -w / 2);
    rect.setAttribute('y', top);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    texts.forEach((t, li) => t.setAttribute('y', top + metrics.chipLine * (li + 1)));
    return { g: chip, w, h };
  }

  // cost: time O(STEPS), heap O(1), stack O(1)
  // vars: STEPS = 이분 탐색 횟수(30)
  // basis: estimate
  // 시간 비율 p에서 이동 곡선의 진행 비율. easing.js의 timeAt과 같은 곡선을 반대 방향으로 푼다.
  function progressAt([x1, y1, x2, y2], p) {
    const axis = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
    let [low, high] = [0, 1];
    for (let i = 0; i < 30; i++) {
      const mid = (low + high) / 2;
      if (axis(x1, x2, mid) < p) low = mid;
      else high = mid;
    }
    return axis(y1, y2, (low + high) / 2);
  }

  // 글 상자가 그림 밖으로 나가면 옆으로 밀어 넣고, 위가 모자라면 점 아래로 내린다.
  function placeChip(chip, point) {
    const box = svg.viewBox.baseVal;
    const half = chip.w / 2 + metrics.chipGap;
    const x = Math.min(box.x + box.width - half, Math.max(box.x + half, point.x)) - point.x;
    const isTooHigh = point.y - chip.h - metrics.chipGap < box.y;
    chip.g.setAttribute('transform', `translate(${x} ${isTooHigh ? chip.h + metrics.chipGap * 2 : 0})`);
  }

  // cost: time O(h + k), heap O(1), stack O(1)
  // vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
  // basis: estimate
  // 프레임마다 점을 옮기고, 도착한 도형의 카드를 바꾸고, 탭 진행 막대를 채운다.
  function drawFrame(now) {
    if (isPlaying) elapsed += (now - before) * rate;
    before = now;
    const seg = segs[index];
    packets.forEach((packet) => packet.move(elapsed));
    pendingCards = pendingCards.filter(({ n, at }) => {
      if (elapsed < at) return true;
      showCards(seg.cards, n);
      return false;
    });
    const steps = stepSegs[seg.si];
    const start = steps[0].t0;
    const end = steps.at(-1).t1;
    buttons[seg.si].querySelector('i').style.width = `${((seg.t0 - start + Math.min(elapsed, seg.t1 - seg.t0)) / (end - start)) * 100}%`;
    if (elapsed >= seg.t1 - seg.t0) enterSegment((index + 1) % segs.length);
    requestAnimationFrame(drawFrame);
  }
}
