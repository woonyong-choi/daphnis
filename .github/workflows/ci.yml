name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 재생기 시험은 실제 Chrome과 WebKit을 연다(test/chrome.js). 없으면 건너뛰지 않고 실패한다.
      CHROME_PATH: /usr/bin/google-chrome
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chrome and WebKit for the browser tests
        run: |
          npx --no-install playwright-core install --with-deps chrome webkit
          "$CHROME_PATH" --version
      # 브라우저 시험은 무거워서 동시에 2개까지만 돌린다.
      - run: npm test
      - run: npm run check
      - run: node src/cli.js check examples/*.dap docs/assets/*.dap --strict

  # 저장소 루트 action.yml을 이 저장소에서 한 번 써서 동작을 확인한다. 마크다운 그림이 낡으면 실패한다.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          paths: docs/design/markdown.md docs/assets/*.dap
          mode: check
          strict: 'true'
